[package]
name = "cc-box"
version = "0.16.10"
description = "Claude Code Desktop GUI (Tauri) - Multi-terminal manager for Claude Code power users"
authors = ["orczh <orczh_hj@163.com>"]
license = "MIT"
repository = "https://github.com/orczh-hj/cc-box"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "parking_lot", "rt-multi-thread", "time", "fs", "io-util", "net"] }
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.11", features = ["json", "blocking", "stream"] }
anyhow = "1"
dirs = "5"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
arc-swap = "1"
chrono = "0.4"
encoding_rs = "0.8"
futures-util = "0.3"
once_cell = "1"
sys-locale = "0.3"
hostname = "0.3"
base64 = "0.22"
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
cc-box-remote-protocol = { path = "../remote/protocol" }
cc-box-web-assets = { path = "../remote/web-assets" }
cc-box-macros = { path = "macros" }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots", "connect"] }
rusqlite = { version = "0.31", features = ["bundled"], optional = true }

[features]
default = ["sqlite"]
sqlite = ["rusqlite"]

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(target_os = "linux"))'.dependencies]
# 托盘只在 Windows/macOS 编译；Linux 保持纯 tokio 无头模式，避免
# libayatana-appindicator 缺失导致 Broker 无法启动。
tauri = { version = "2", features = ["tray-icon", "image-png"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true
