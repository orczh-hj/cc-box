[package]
name = "cc-box-relay"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "CC-Box remote relay server (transparent routing hub + pairing)"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
parking_lot = "0.12"
rust-embed = "8"

[dev-dependencies]
tokio-tungstenite = "0.24"

[lib]
name = "cc_box_relay"
path = "src/lib.rs"

[[bin]]
name = "cc-box-relay"
path = "src/main.rs"
